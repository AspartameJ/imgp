name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true
      - run: go build ./...
      - run: go vet ./...
      - run: |
          gofmt_files=$(gofmt -l .)
          if [ -n "$gofmt_files" ]; then
            echo "gofmt needs formatting on:"
            echo "$gofmt_files"
            exit 1
          fi
        shell: bash
        if: runner.os != 'Windows'
      - run: go test -cover ./...
      - if: runner.os == 'Windows'
        run: |
          $files = gofmt -l .
          if ($files) { Write-Host "gofmt issues:`n$files"; exit 1 }
        shell: pwsh
