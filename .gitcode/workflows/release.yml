name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v2.2.3); empty = latest tag"
        required: false
        default: ""
      dry_run:
        description: "Build only, skip publishing to Releases"
        type: boolean
        required: false
        default: true

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: checkout
      - name: Setup Go
        uses: setup-go
        with:
          go-version: '1.22'

      - name: Resolve tag
        run: |
          cd repo_workspace
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ] && [ -n "${GITHUB_REF_NAME:-}" ]; then TAG="$GITHUB_REF_NAME"; fi
          if [ -z "$TAG" ]; then TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"; fi
          if [ -z "$TAG" ]; then TAG="v0.0.0-dev"; fi
          printf '%s' "$TAG" > .release_tag
          echo "Resolved tag: $TAG"

      - name: Build all platforms
        run: |
          set -e
          cd repo_workspace
          VERSION="$(sed 's/^v//' .release_tag)"
          mkdir -p dist
          for pair in linux/amd64 linux/arm64 windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${pair%/*}
            GOARCH=${pair#*/}
            EXT=""
            if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
            OUT="dist/imgp_${GOOS}_${GOARCH}${EXT}"
            echo "building $OUT (version $VERSION)"
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -trimpath \
              -ldflags "-s -w -X gitcode.com/DonaldTom/imgp/internal/version.Version=$VERSION" \
              -o "$OUT" .
          done
          cd dist && sha256sum imgp_* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish to Releases
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -e
          cd repo_workspace
          if [ "$DRY_RUN" = "true" ]; then
            echo "dry run, skipping publish"
            exit 0
          fi
          TAG="$(cat .release_tag)"
          OWNER=DonaldTom
          REPO=imgp
          API=https://api.gitcode.com/api/v5
          if [ -z "$GITCODE_TOKEN" ]; then
            echo "ERROR: secret GITCODE_TOKEN is not configured"
            exit 1
          fi
          code=$(curl -s -o /tmp/rel.json -w '%{http_code}' \
            "$API/repos/$OWNER/$REPO/releases/tags/$TAG?access_token=$GITCODE_TOKEN")
          if [ "$code" = "404" ]; then
            echo "Creating release $TAG ..."
            curl -s -X POST "$API/repos/$OWNER/$REPO/releases?access_token=$GITCODE_TOKEN" \
              -H 'Content-Type: application/json' \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"body\":\"See CHANGELOG.md for details.\"}" \
              > /tmp/rel.json
            if ! grep -q '"tag_name"' /tmp/rel.json; then
              echo "ERROR: release creation failed"
              cat /tmp/rel.json
              exit 1
            fi
          elif [ "$code" != "200" ]; then
            echo "ERROR: unexpected HTTP $code while checking release"
            cat /tmp/rel.json
            exit 1
          else
            echo "Release $TAG already exists, uploading attachments"
          fi
          for f in dist/imgp_* dist/SHA256SUMS.txt; do
            name=$(basename "$f")
            up=$(curl -s "$API/repos/$OWNER/$REPO/releases/$TAG/upload_url?access_token=$GITCODE_TOKEN&file_name=$name")
            url=$(printf '%s' "$up" | grep -o '"url" *: *"[^"]*"' | head -1 | cut -d'"' -f4 | sed 's#\\/#/#g')
            h1=$(printf '%s' "$up" | grep -o '"x-obs-meta-project-id" *: *"[^"]*"' | head -1 | cut -d'"' -f4 | sed 's#\\/#/#g')
            h2=$(printf '%s' "$up" | grep -o '"x-obs-acl" *: *"[^"]*"' | head -1 | cut -d'"' -f4 | sed 's#\\/#/#g')
            h3=$(printf '%s' "$up" | grep -o '"x-obs-callback" *: *"[^"]*"' | head -1 | cut -d'"' -f4 | sed 's#\\/#/#g')
            ct=$(printf '%s' "$up" | grep -o '"Content-Type" *: *"[^"]*"' | head -1 | cut -d'"' -f4 | sed 's#\\/#/#g')
            if [ -z "$url" ]; then
              echo "ERROR: no upload url for $name"
              echo "$up"
              exit 1
            fi
            upcode=$(curl -s -o /tmp/up_resp -w '%{http_code}' -X PUT "$url" \
              -H "x-obs-meta-project-id: $h1" \
              -H "x-obs-acl: $h2" \
              -H "x-obs-callback: $h3" \
              -H "Content-Type: ${ct:-application/octet-stream}" \
              --data-binary "@$f")
            echo "uploaded $name -> HTTP $upcode"
            if [ "$upcode" -lt 200 ] || [ "$upcode" -ge 300 ]; then
              echo "ERROR: upload failed for $name"
              cat /tmp/up_resp
              exit 1
            fi
          done
          echo "Release $TAG published with attachments"
