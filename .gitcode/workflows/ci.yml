name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: gofmt, vet and golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: checkout
      - name: Setup Go
        uses: setup-go
        with:
          go-version: '1.22'
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        run: go run github.com/golangci/golangci-lint/cmd/golangci-lint@v1.59.1 run

  test:
    name: go test race
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: checkout
      - name: Setup Go
        uses: setup-go
        with:
          go-version: '1.22'
      - name: go test
        run: go test -race -count=1 ./...
