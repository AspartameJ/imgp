name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: gofmt + vet + golangci-lint
    runs-on: euleros-2.10.1
    steps:
      - uses: checkout-action@0.0.1
      - uses: setup-go@0.0.1
        with:
          go-version: '1.22'
      - name: gofmt
        run: cd repo_workspace && test -z "$(gofmt -l .)"
      - name: go vet
        run: cd repo_workspace && go vet ./...
      - name: golangci-lint
        run: cd repo_workspace && go run github.com/golangci/golangci-lint/cmd/golangci-lint@v1.59.1 run

  test:
    name: go test -race
    runs-on: euleros-2.10.1
    steps:
      - uses: checkout-action@0.0.1
      - uses: setup-go@0.0.1
        with:
          go-version: '1.22'
      - name: go test
        run: cd repo_workspace && go test -race -count=1 ./...
