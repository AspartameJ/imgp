version: "2"

run:
  timeout: 5m

linters:
  enable:
    - bodyclose
    - errcheck
    - goconst
    - gosec
    - govet
    - ineffassign
    - noctx
    - prealloc
    - staticcheck
    - unused

  exclusions:
    rules:
      # Allow unchecked errors in defer (common Go pattern).
      - linters: [gosec]
        text: "G104"
      - linters: [gosec]
        text: "G307"
