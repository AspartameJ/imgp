run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - goconst
    - gosec
    - noctx
    - bodyclose
    - prealloc

issues:
  exclude-use-default: false
  exclude:
    - "G104"  # Allow unchecked errors in defer (common Go pattern)
    - "G307"  # Allow unchecked errors when closing via defer
