version: "2"

run:
  timeout: 5m

# golangci-lint v2 enables the "standard" set by default (errcheck, govet,
# ineffassign, staticcheck, unused), so only opt-in linters are listed here.
linters:
  enable:
    - bodyclose
    - goconst
    - gosec
    - noctx
    - prealloc

  exclusions:
    rules:
      # Test files: unchecked cleanup errors, repeated literals and permissive
      # file modes are expected and not worth annotating.
      - path: _test\.go
        linters: [errcheck, goconst, gosec]
      # Allow unchecked errors in defer (common Go pattern).
      - linters: [gosec]
        text: "G104"
      - linters: [gosec]
        text: "G307"
